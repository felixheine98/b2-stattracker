services:
  db:
    image: postgres:16-alpine

    security_opt:
      - no-new-privileges:true

    mem_limit: 512m
    pids_limit: 150

    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-stattracker}
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      # The path the app is served under is fixed when the production image is built
      args:
        BASE_PATH: ${BASE_PATH:-/b2-stats}

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    read_only: true

    tmpfs:
      - /tmp:size=64m,mode=1777,uid=1001,gid=65533

    mem_limit: 512m
    pids_limit: 150

    restart: unless-stopped

    ports:
      - "127.0.0.1:${PORT:-3050}:3000"

    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      AUTH_URL: ${AUTH_URL:-https://reh-netsolutions.cc/api/auth}
      AUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required}
      AUTH_TRUST_HOST: "true"
      # Path the app is served under; the production image also needs it at build time
      BASE_PATH: ${BASE_PATH:-/b2-stats}
      TMIO_USER_AGENT: ${TMIO_USER_AGENT:-}
      DISCORD_BOT_URL: http://discord-bot:3080
      DISCORD_BOT_API_TOKEN: ${DISCORD_BOT_PROD_API_TOKEN:?DISCORD_BOT_PROD_API_TOKEN is required}

    depends_on:
      db:
        condition: service_healthy

    healthcheck:
      test:
        - CMD-SHELL
        - wget -q --spider http://127.0.0.1:3000${BASE_PATH:-/b2-stats}/login || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Only reads messages and reactions; the member directory bot keeps running separately.
  discord-bot:
    build:
      context: ${DISCORD_BOT_SOURCE:-../b2-member}
      dockerfile: Dockerfile.reactions
    user: "1000:1000"
    working_dir: /bot
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    pids_limit: 100
    env_file:
      - ${DISCORD_BOT_ENV_FILE:-../b2-member/.env}
    environment:
      DISCORD_BOT_API_TOKEN: ${DISCORD_BOT_PROD_API_TOKEN:?DISCORD_BOT_PROD_API_TOKEN is required}
      DISCORD_BOT_API_HOST: "0.0.0.0"
      DISCORD_BOT_API_PORT: "3080"
      # When reactions came in: the one place the bot may write to
      REACTION_TIMES_DIR: /bot/times
    volumes:
      - ../b2-member/data:/bot/data:ro
      - reaction_times:/bot/times

volumes:
  postgres_data:
  reaction_times:

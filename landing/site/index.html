<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>B2 eSports</title>
  <meta name="description" content="B2 eSports – Trackmania Team. Ergebnisse und Statistiken unserer Lineups.">
  <meta name="theme-color" content="#0b0d1c">
  <link rel="icon" href="/favicon.png">
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #f5f0f0;
      background: #0b0d1c;
    }
    /* The picture fills the screen; on narrow screens the smaller file is enough */
    main {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.75rem;
      padding: 2rem 1.5rem;
      text-align: center;
      background:
        radial-gradient(ellipse at center, rgba(11, 13, 28, .55) 0%, rgba(11, 13, 28, .88) 75%),
        url("/background-small.jpg") center / cover no-repeat;
    }
    @media (min-width: 900px) {
      main {
        background:
          radial-gradient(ellipse at center, rgba(11, 13, 28, .5) 0%, rgba(11, 13, 28, .85) 75%),
          url("/background.jpg") center / cover no-repeat;
      }
    }
    .logo {
      width: clamp(9rem, 22vw, 13rem);
      aspect-ratio: 1;
      padding: 1.1rem;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 0 4px rgba(251, 208, 13, .55), 0 20px 60px rgba(0, 0, 0, .6);
    }
    .logo img { width: 100%; height: 100%; object-fit: contain; display: block; }
    h1 { font-size: clamp(1.9rem, 5vw, 3rem); font-weight: 800; letter-spacing: -.02em; }
    p { color: #c5bfbf; font-size: 1.05rem; margin-top: .4rem; }
    a.button {
      display: inline-block;
      padding: .85rem 2.4rem;
      border-radius: .6rem;
      background: #FBD00D;
      color: #1a1718;
      font-weight: 700;
      font-size: 1.05rem;
      text-decoration: none;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .45);
      transition: transform .15s ease, background .15s ease;
    }
    a.button:hover, a.button:focus-visible { background: #ffe04d; transform: translateY(-2px); }
    a.button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
    footer { position: fixed; bottom: .75rem; left: 0; right: 0; font-size: .7rem; color: rgba(245, 240, 240, .45); }
  </style>
</head>
<body>
  <main>
    <div class="logo"><img src="/logo.png" alt="B2 eSports Logo" width="512" height="512"></div>
    <div>
      <h1>B2 eSports</h1>
      <p>Trackmania Team</p>
    </div>
    <a class="button" href="/stats">Stats</a>
    <footer>Bild: SchumiSkins – Racing Livery Designs</footer>
  </main>
</body>
</html>

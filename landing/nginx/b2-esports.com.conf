# b2-esports.com: the start page from /var/www/b2-esports.com, the stats app under /stats.
# Starts as plain HTTP; `certbot --nginx` adds the HTTPS part (see landing/README.md).

server {
    listen 80;
    server_name b2-esports.com www.b2-esports.com;

    root /var/www/b2-esports.com;
    index index.html;

    # Start page: only the files that exist, nothing else
    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(jpg|png)$ {
        expires 7d;
        try_files $uri =404;
    }

    # Stats app (Next.js in Docker, see docker-compose.yml); same settings as on reh-netsolutions.cc
    location /stats {
        proxy_pass http://127.0.0.1:3050;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

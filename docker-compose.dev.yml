# Dev setup next to production: its own project, database and address.
#   docker compose -f docker-compose.dev.yml up -d --build
# Runs `next dev` on the mounted source, so code changes show up without a rebuild. It is served
# under DEV_BASE_PATH (nginx has to send that path to DEV_PORT) and works on a copy of the data,
# so a schema change tried here cannot break production (see docker-dev-entrypoint.sh: db push).
# Production is the plain docker-compose.yml: docker compose up -d --build
name: b2-stattracker-dev

services:
  db:
    image: postgres:16-alpine

    security_opt:
      - no-new-privileges:true

    mem_limit: 512m
    pids_limit: 150

    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-stattracker}
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    tmpfs:
      - /tmp:size=64m,mode=1777

    mem_limit: 3g
    pids_limit: 1000

    restart: unless-stopped

    ports:
      - "127.0.0.1:${DEV_PORT:-3052}:3000"

    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      # Same sign-in as production: on the same host both share the session cookie
      AUTH_URL: ${AUTH_URL:-https://reh-netsolutions.cc/api/auth}
      AUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required}
      AUTH_TRUST_HOST: "true"
      BASE_PATH: ${DEV_BASE_PATH:-/stats-dev}
      TMIO_USER_AGENT: ${TMIO_USER_AGENT:-}
      # Format rules per competition (docs/adr/005): "on" or "off". Dev only; production ignores it.
      MATCH_RULES: "on"
      # Lineup planning per match day (docs/adr/008): "on" or "off". Dev only; production ignores it.
      MATCHDAY_PLANNING: "on"
      # The VOD archive (docs/adr/011) with its privacy page: DEV_VOD_ARCHIVE=manual in .env, off without
      VOD_ARCHIVE: ${DEV_VOD_ARCHIVE:-off}
      # Comparison page of old stats screenshots (docs/adr/007): "on" or "off". Dev only; production
      # ignores it. The screenshots are read from the local Discord export, mounted read-only.
      SUMMARY_COMPARE: "on"
      SUMMARY_SCREENSHOTS_DIR: /screenshots
      DISCORD_BOT_URL: http://discord-bot:3080
      APP_FEEDBACK: "on"
      DISCORD_BOT_API_TOKEN: ${DISCORD_BOT_API_TOKEN:?DISCORD_BOT_API_TOKEN is required}

    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - ${SUMMARY_SCREENSHOTS_SOURCE:-${HOME}/discord-export/admins-1060207503046082592}:/screenshots:ro

    depends_on:
      db:
        condition: service_healthy

    healthcheck:
      test:
        - CMD-SHELL
        - wget -q --spider http://127.0.0.1:3000${DEV_BASE_PATH:-/stats-dev}/login || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s

  # Discord client without command registration or member updates; it writes only the matchday
  # announcement it is asked to post (ANNOUNCEMENTS, docs/adr/008).
  discord-bot:
    build:
      context: ${DISCORD_BOT_SOURCE:-../b2-member}
      dockerfile: Dockerfile.reactions
    user: "1000:1000"
    working_dir: /bot
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    pids_limit: 100
    env_file:
      - ${DISCORD_BOT_ENV_FILE:-../b2-member/.env}
    environment:
      DISCORD_BOT_API_TOKEN: ${DISCORD_BOT_API_TOKEN:?DISCORD_BOT_API_TOKEN is required}
      DISCORD_BOT_API_HOST: "0.0.0.0"
      DISCORD_BOT_API_PORT: "3080"
      # When reactions came in: the one place the bot may write to
      REACTION_TIMES_DIR: /bot/times
      # Channels with announcements: their reactions are written down from the post on, not only after the first fetch
      REACTION_TIMES_CHANNELS: ${REACTION_TIMES_CHANNELS:-940049796633341983}
      # Matchday pings that mark the bot and announcements it posts (docs/adr/008), with MATCHDAY_PLANNING
      ANNOUNCEMENTS: "on"
      APP_FEEDBACK: "on"
      FEEDBACK_NAMESPACE: "stattracker-dev"
      FEEDBACK_API_URL: http://app:3000${DEV_BASE_PATH:-/stats-dev}/api/internal/feedback
    volumes:
      - ../b2-member/data:/bot/data:ro
      - reaction_times:/bot/times

  # Backs up the ranges of Twitch VODs to the team's YouTube channel (docs/adr/011-vod-archiv.md)
  vod-worker:
    build:
      context: .
      dockerfile: Dockerfile.vod-worker
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    pids_limit: 100
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      # Off unless DEV_VOD_ARCHIVE=manual is set in .env; dev backs up only what an admin asks for
      # by hand, as private videos (ADR 011, question 11)
      VOD_ARCHIVE: ${DEV_VOD_ARCHIVE:-off}
    # The source as mounted for next dev, with the dev app's node_modules and Prisma client
    command: ["node", "--disable-warning=MODULE_TYPELESS_PACKAGE_JSON", "worker/vod-worker.ts"]
    volumes:
      - .:/app:ro
      - node_modules:/app/node_modules:ro
      - vod_work:/work
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  reaction_times:
  node_modules:
  vod_work:
